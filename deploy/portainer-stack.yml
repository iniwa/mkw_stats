services:
  postgres:
    container_name: mkw-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      POSTGRES_DB: ${POSTGRES_DB:-mkw_stats}
      POSTGRES_USER: ${POSTGRES_USER:-mkw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ${DATA_DIR:-/home/iniwa/docker/mkw-stats}/postgres:/var/lib/postgresql/data

  backend:
    container_name: mkw-backend
    image: ghcr.io/iniwa/mkw-stats-backend:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      DATABASE_URL: postgresql://${POSTGRES_USER:-mkw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mkw_stats}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      - postgres

  frontend:
    container_name: mkw-frontend
    image: ghcr.io/iniwa/mkw-stats-frontend:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
    ports:
      - "${FRONTEND_PORT:-3030}:80"
    depends_on:
      - backend
